    <meta name="theme-color" content="#07050d">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function (h) {
            h.classList.add('js');
            try { if (sessionStorage.getItem('pt')) { h.classList.add('pt-enter'); sessionStorage.removeItem('pt'); } } catch (e) {}
        })(document.documentElement);
    </script>
</head>
<body class="page-contact">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div class="curtain" aria-hidden="true"></div>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="ambient" aria-hidden="true"></div>
    <div class="grid-bg" aria-hidden="true"></div>

    <header class="site-header">
        <a href="index.html" class="logo" aria-label="Siméon Nsasi — accueil">
            <span class="logo-mark">SN</span><span class="logo-text">Siméon Nsasi</span>
        </a>
        <button class="menu-toggle" id="menu-icon" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="site-nav"><i class="bx bx-menu"></i></button>
        <nav id="site-nav" class="site-nav" aria-label="Navigation principale">
            <a href="index.html"><span class="nav-n">01</span>Accueil</a>
            <a href="about.html"><span class="nav-n">02</span>À propos</a>
            <a href="services.html"><span class="nav-n">03</span>Services</a>
            <a href="portfolio.html"><span class="nav-n">04</span>Portfolio</a>
            <a href="contact.html" class="active" aria-current="page"><span class="nav-n">05</span>Contact</a>
        </nav>
    </header>

    <main id="main">
        <div class="container">
            <div class="page-head">
                <p class="eyebrow" data-reveal>05 — Parlons-nous</p>
                <h1 data-split><span class="grad">Contactez</span>-moi</h1>
            </div>

            <div class="contact-layout">
                <div class="contact-info" data-stagger>
                    <a class="card info-card" href="tel:+243817461115">
                        <i class="bx bxs-phone"></i>
                        <div><small>Phone</small><strong>+243 817 461 115</strong></div>
                    </a>
                    <a class="card info-card" href="mailto:ivannsasi06@gmail.com">
                        <i class="bx bxs-envelope"></i>
                        <div><small>Email</small><strong>ivannsasi06@gmail.com</strong></div>
                    </a>
                    <div class="card info-card">
                        <i class="bx bxs-map"></i>
                        <div><small>Adresse</small><strong>Kinshasa, RDC</strong></div>
                    </div>
                    <div class="contact-social">
                        <span>Réseaux</span>
                        <div class="socials">
                            <a href="https://www.facebook.com/ivan.nsasi.3" class="btn btn--icon" data-magnetic target="_blank" rel="noopener noreferrer" aria-label="Facebook"><i class="bx bxl-facebook"></i></a>
                            <a href="https://www.linkedin.com/in/sim%C3%A9on-nsasi-526733238" class="btn btn--icon" data-magnetic target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="bx bxl-linkedin"></i></a>
                            <a href="https://wa.me/+243817461115" class="btn btn--icon" data-magnetic target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><i class="bx bxl-whatsapp"></i></a>
                            <a href="https://github.com/Hacker-sim" class="btn btn--icon" data-magnetic target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="bx bxl-github"></i></a>
                        </div>
                    </div>
                </div>

                <div class="card form-card" data-reveal style="--delay:150ms">
                    <form id="contact-form" novalidate>
                        <h2>Envoyer <span class="grad">un message</span></h2>
                        <div class="field-grid">
                            <div class="field"><input id="f-name" name="name" type="text" placeholder=" " required autocomplete="name"><label for="f-name">Nom</label></div>
                            <div class="field"><input id="f-email" name="email" type="email" placeholder=" " required autocomplete="email"><label for="f-email">Email</label></div>
                            <div class="field"><input id="f-phone" name="phone" type="tel" placeholder=" " required autocomplete="tel"><label for="f-phone">Phone</label></div>
                            <div class="field"><input id="f-subject" name="subject" type="text" placeholder=" " required><label for="f-subject">Email subject</label></div>
                            <div class="field field--full"><textarea id="f-message" name="message" placeholder=" " required></textarea><label for="f-message">Message</label></div>
                        </div>
                        <div class="form-foot">
                            <button type="submit" class="btn" data-magnetic><span>Envoyer</span><i class="bx bx-send"></i><span class="spin" aria-hidden="true"></span></button>
                            <p class="form-status" role="status" aria-live="polite"></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span data-year>2026</span> Siméon Nsasi · Kinshasa, RDC</p>
            <div class="socials">
                <a href="https://github.com/Hacker-sim" class="btn btn--icon" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="bx bxl-github"></i></a>
                <a href="https://www.linkedin.com/in/sim%C3%A9on-nsasi-526733238" class="btn btn--icon" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="bx bxl-linkedin"></i></a>
                <a href="https://wa.me/+243817461115" class="btn btn--icon" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><i class="bx bxl-whatsapp"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
